name: Check published internal links

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check published regional pages and their internal links
        run: python3 scripts/check-published-internal-links.py
