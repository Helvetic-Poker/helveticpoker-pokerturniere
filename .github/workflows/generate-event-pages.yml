name: Generate and deploy tournament pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/*.json"
      - "index.html"
      - "scripts/generate-landing-pages.py"
      - "scripts/generate-homepage-hub.py"
      - ".github/workflows/generate-event-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate tournament pages
        run: |
          python3 - <<'PY'
          import json
          import html
          import re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import quote

          ROOT = Path(".")
          DATA_DIR = ROOT / "data"
          OUT_DIR = ROOT / "turniere"
          BASE_URL = "https://pokerturniere.helveticpoker.ch"

          CANTON_NAMES = {
              "AG": "Aargau", "AR": "Appenzell Ausserrhoden", "AI": "Appenzell Innerrhoden",
              "BL": "Basel-Landschaft", "BS": "Basel-Stadt", "BE": "Bern", "FR": "Freiburg",
              "GE": "Genf", "GL": "Glarus", "GR": "Graubünden", "JU": "Jura", "LU": "Luzern",
              "NE": "Neuenburg", "NW": "Nidwalden", "OW": "Obwalden", "SG": "St. Gallen",
              "SH": "Schaffhausen", "SZ": "Schwyz", "SO": "Solothurn", "TG": "Thurgau",
              "TI": "Tessin", "UR": "Uri", "VD": "Waadt", "VS": "Wallis", "ZG": "Zug",
              "ZH": "Zürich"
          }



          # Verifizierte Veranstaltungsadressen. Nur Standorte mit belastbarer
          # Anbieter- oder Maps-Quelle werden hier hinterlegt.
          VENUE_ADDRESS_OVERRIDES = {
              ("24Poker", "Oberentfelden"): {"street_address": "Industriestrasse 23", "postal_code": "5036", "city": "Oberentfelden"},
              ("AZ Poker Club Bern", "Bern"): {"street_address": "Zentweg 19", "postal_code": "3006", "city": "Bern"},
              ("Airfield Poker Club", "Wilderswil"): {"street_address": "Mittelweg 9", "postal_code": "3812", "city": "Wilderswil"},
              ("Pokerhelden / Airfield Poker Club", "Wilderswil"): {"street_address": "Mittelweg 9", "postal_code": "3812", "city": "Wilderswil"},
              ("Another Poker", "Basel"): {"street_address": "Uferstrasse 90", "postal_code": "4057", "city": "Basel"},
              ("Another Poker Basel", "Basel"): {"street_address": "Uferstrasse 90", "postal_code": "4057", "city": "Basel"},
              ("Capital Poker Club", "Bern"): {"street_address": "Lagerhausweg 10", "postal_code": "3018", "city": "Bern"},
              ("Capital Poker Club Bern", "Bern"): {"street_address": "Lagerhausweg 10", "postal_code": "3018", "city": "Bern"},
              ("FOIF DRÜ", "Effretikon"): {"street_address": "Spinnereiweg 6", "postal_code": "8307", "city": "Effretikon"},
              ("FOIF DRÜ EFFRETIKON", "Effretikon"): {"street_address": "Spinnereiweg 6", "postal_code": "8307", "city": "Effretikon"},
              ("Fridli Poker Vereinslokal", "Glarus"): {"street_address": "Rathausgasse 25", "postal_code": "8750", "city": "Glarus"},
              ("Grand Casino Luzern", "Luzern"): {"street_address": "Haldenstrasse 6", "postal_code": "6006", "city": "Luzern"},
              ("HSOP Helvetic Series of Poker", "Chur"): {"street_address": "Kantonsstrasse 62", "postal_code": "7205", "city": "Zizers"},
              ("HSOP Helvetic Series of Poker", "Zizers"): {"street_address": "Kantonsstrasse 62", "postal_code": "7205", "city": "Zizers"},
              ("Munot Poker", "Schaffhausen"): {"street_address": "Ernst Hombergerstrasse 5", "postal_code": "8207", "city": "Schaffhausen"},
              ("Poker Club St. Gallen", "St. Gallen"): {"street_address": "Lindenstrasse 61", "postal_code": "9000", "city": "St. Gallen"},
              ("Prestige Poker", "Dietlikon"): {"street_address": "Industriestrasse 28", "postal_code": "8305", "city": "Dietlikon"},
              ("Prestige Poker Dietlikon", "Dietlikon"): {"street_address": "Industriestrasse 28", "postal_code": "8305", "city": "Dietlikon"},
              ("Pöstli Poker", "Burgdorf"): {"street_address": "Hohengasse 10", "postal_code": "3400", "city": "Burgdorf"},
              ("RPR/Roger's Pokerroom", "Düdingen"): {"street_address": "Bonnstrasse 22", "postal_code": "3186", "city": "Düdingen"},
              ("STATION Poker Club", "Biel/Bienne"): {"street_address": "Ohmweg 10", "postal_code": "2504", "city": "Biel/Bienne"},
              ("Sports Zugerland", "Cham"): {"street_address": "Riedstrasse 1a", "postal_code": "6330", "city": "Cham"},
              ("sports ZUGERLAND", "Cham"): {"street_address": "Riedstrasse 1a", "postal_code": "6330", "city": "Cham"},
              ("Swiss Casino St. Gallen", "St. Gallen"): {"street_address": "St. Jakob-Strasse 55", "postal_code": "9000", "city": "St. Gallen"},
          }
          provider_logos = {
              "24Poker":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6b50286d-2f09-47d4-a018-8c326b0ecef7/1774464947679-24poker.png",
          "AZ Poker Club Bern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/1170cdc9-4cb0-4ac0-902f-19c369fa99b4/1774464942453-azpokerclub.jpg",
          "Airfield Pokerclub Interlaken":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/3a6035b2-ab43-4807-b3a5-28185be8f40b/1774465014142-pokerhelden.jpg",
          "Pokerhelden / Airfield Poker Club":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/3a6035b2-ab43-4807-b3a5-28185be8f40b/1774465014142-pokerhelden.jpg",
          "Another Poker Basel":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/c04768c0-8968-455e-acb3-38a42b79c3ee/1774464902622-anotherpoker.png",
          "Capital Poker Club Bern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/415712c9-af88-4b1e-a4a0-5ebc87de4470/1774464996304-capitalpokerclub.png",
          "FOIF DRÜ EFFRETIKON":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/d5555268-b285-4c9f-8c62-8a53811cc8da/1774464838755-foifdrue.png",
          "FullEdge Pokerclub Pratteln BL":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/e1315bad-abde-460a-9ee0-6a2bda3e13fb/1774464850053-fulledge.jpg",
          "House of Cards Luzern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/e20c02d3-49e6-4dfb-b2c2-4b20f29eadad/1774464785696-houseofcards.jpg",
          "HSOP Helvetic Series of Poker":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/711a2b69-fae1-4b0b-afca-e83c36e2d9c1/1774464992979-hsop.jpg",
          "Munot Poker Schaffhausen":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6ce78667-c164-4a86-8874-e95496cb0bf5/1774464745546-munotpoker.png",
          "Prestige Poker Dietlikon":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6870a596-1d3e-466f-af92-5dc034a1d727/1774464799361-prestigepoker.jpg",
          "STATION Poker Club":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/7a6418b7-dfb0-4519-aab5-e857f421a6d7/1774464732962-stationpokerclub.jpg",
          "Poker Club St. Gallen":
              "/assets/logos/poker-club-st-gallen.png",
          "Swiss Casino St. Gallen":
              "https://static.wixstatic.com/media/98a788_df2ae3f8c7e34e1ab9eba87e99a6f506~mv2.png/v1/fill/w_1024%2Ch_768%2Cal_c/Logo_SwissCasino4_3%20%282%29.png",
          "Grand Casino Luzern":
              "https://luzernerfest.ch/images/sponsoren/casino-luzern.png",
          "sports ZUGERLAND":
              "https://media.jobs.ch/media/f07dacd6-410e-4b8f-ae42-d713278866bc",
          "Fridli Poker":
              "/assets/logos/fridli-poker.jpg",
          }

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def slugify(value):
              value = str(value or "").strip().lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-")

          def event_slug(event):
              slug = event.get("slug")
              if slug:
                  return slug

              parts = [
                  event.get("title"),
                  event.get("city"),
                  event.get("date_start"),
                  event.get("id"),
              ]
              return slugify("-".join(str(x) for x in parts if x))

          events = []

          for path in sorted(DATA_DIR.glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if isinstance(data, list):
                  events.extend(data)
              elif isinstance(data, dict):
                  if isinstance(data.get("events"), list):
                      events.extend(data["events"])
                  else:
                      events.append(data)

          generated = 0
          sitemap_urls = {f"{BASE_URL}/"}

          for event in events:
              slug = event_slug(event)

              if not slug:
                  continue

              title = event.get("title") or "Pokerturnier"
              subtitle = event.get("subtitle") or ""
              city = event.get("city") or ""
              organizer = event.get("organizer") or ""
              venue = event.get("venue") or organizer
              variant = event.get("variant") or ""
              event_type = event.get("event_type") or ""
              buy_in_label = event.get("buy_in_label") or ""
              date_start = event.get("date_start") or ""
              date_end = event.get("date_end") or date_start
              time = event.get("time") or ""
              organizer_url = event.get("organizer_url") or ""
              street_address = (
                  event.get("street_address")
                  or event.get("address")
                  or event.get("venue_address")
                  or ""
              )
              postal_code = event.get("postal_code") or event.get("zip") or ""

              venue_override = VENUE_ADDRESS_OVERRIDES.get((venue, city)) or VENUE_ADDRESS_OVERRIDES.get((organizer, city)) or {}
              if venue_override:
                  street_address = venue_override.get("street_address") or street_address
                  postal_code = venue_override.get("postal_code") or postal_code
                  city = venue_override.get("city") or city

              display_date = date_start

              if date_start:
                  try:
                      y, m, d = date_start.split("-")
                      display_date = f"{d}.{m}.{y}"
                  except Exception:
                      pass

              date_text = display_date

              details = []

              if variant:
                  details.append(variant)

              if buy_in_label:
                  details.append(f"Buy-in {buy_in_label}")

              if event_type:
                  details.append(event_type)

              detail_text = ", ".join(details)

              description_parts = []
              if organizer:
                  description_parts.append(f"Beim {title} von {organizer}")
              else:
                  description_parts.append(f"Beim {title}")
              if variant:
                  description_parts.append(f"steht {variant} im Mittelpunkt")
              elif subtitle:
                  description_parts.append(f"geht es um {subtitle}")
              if buy_in_label:
                  description_parts.append(f"mit einem Buy-in von {buy_in_label}")
              if event_type and event_type.lower() not in {"regular", "regelmässig"}:
                  description_parts.append(f"als {event_type}-Turnier")
              description = " ".join(description_parts).strip()
              if description and not description.endswith("."):
                  description += "."


              url = f"{BASE_URL}/turniere/{slug}/"

              logo = (
                  provider_logos.get(organizer)
                  or event.get("provider_logo")
                  or ""
              )

              organizer_logo_html = ""

              if logo:
                  organizer_logo_html = f"""
                  <div class="organizer-logo">
                    <img
                      src="{esc(logo)}"
                      alt="{esc(organizer)} Logo"
                      loading="lazy">
                  </div>
                  """

              start_date_iso = date_start
              end_date_iso = date_end or date_start

              if date_start and time:
                  try:
                      local_dt = datetime.strptime(
                          f"{date_start} {time}",
                          "%Y-%m-%d %H:%M"
                      ).replace(
                          tzinfo=ZoneInfo("Europe/Zurich")
                      )

                      start_date_iso = local_dt.isoformat()
                  except Exception:
                      start_date_iso = f"{date_start}T{time}:00"

              if date_end and date_end != date_start:
                  # The source data contains an end date but no verified end time.
                  # Do not invent a finishing time for structured data.
                  end_date_iso = date_end
              address_json = {
                  "@type": "PostalAddress",
                  "addressLocality": city,
                  "addressRegion": event.get("canton") or "",
                  "addressCountry": "CH"
              }

              if street_address:
                  address_json["streetAddress"] = street_address

              if postal_code:
                  address_json["postalCode"] = postal_code

              event_json = {
                  "@context": "https://schema.org",
                  "@type": "Event",
                  "@id": url + "#event",
                  "url": url,
                  "name": title,
                  "description": description,
                  "startDate": start_date_iso,
                  "eventStatus": "https://schema.org/EventScheduled",
                  "location": {
                      "@type": "Place",
                      "name": venue or city,
                      "address": address_json
                  },
                  "organizer": {
                      "@type": "Organization",
                      "name": organizer
                  }
              }

              if date_end and date_end != date_start:
                  event_json["endDate"] = end_date_iso

              if organizer_url:
                  event_json["organizer"]["url"] = organizer_url

              # Only link to landing pages that are actually generated.
              # Landing pages require at least two upcoming events.
              today_key = datetime.now(ZoneInfo("Europe/Zurich")).strftime("%Y-%m-%d")
              landing_city_counts = {}
              landing_organizer_counts = {}
              landing_canton_counts = {}
              for candidate in events:
                  candidate_date = candidate.get("date_start") or ""
                  if candidate_date < today_key:
                      continue
                  candidate_city = (candidate.get("city") or "").strip()
                  candidate_organizer = (candidate.get("organizer") or "").strip()
                  candidate_canton = str(candidate.get("canton") or "").strip().upper()
                  if candidate_city:
                      landing_city_counts[candidate_city] = landing_city_counts.get(candidate_city, 0) + 1
                  if candidate_organizer:
                      landing_organizer_counts[candidate_organizer] = landing_organizer_counts.get(candidate_organizer, 0) + 1
                  candidate_canton_name = CANTON_NAMES.get(candidate_canton) or ""
                  if candidate_canton_name:
                      landing_canton_counts[candidate_canton_name] = landing_canton_counts.get(candidate_canton_name, 0) + 1

              landing_cities = {name for name, count in landing_city_counts.items() if count >= 2}
              landing_organizers = {name for name, count in landing_organizer_counts.items() if count >= 2}
              landing_cantons = {name for name, count in landing_canton_counts.items() if count >= 2}

              # Find a small set of useful internal links to other real tournament pages.
              same_city = []
              same_organizer = []

              for other in events:
                  other_slug = event_slug(other)
                  if not other_slug or other_slug == slug:
                      continue

                  if city and (other.get("city") or "") == city:
                      same_city.append(other)

                  if organizer and (other.get("organizer") or "") == organizer:
                      same_organizer.append(other)

              def related_sort(item):
                  return (
                      item.get("date_start") or "9999-99-99",
                      item.get("time") or "99:99",
                      item.get("title") or ""
                  )

              today_key = datetime.now(ZoneInfo("Europe/Zurich")).strftime("%Y-%m-%d")
              same_city = sorted(
                  [item for item in same_city if (item.get("date_start") or "") >= today_key and (item.get("city") or "") in landing_cities],
                  key=related_sort
              )[:4]
              same_organizer = sorted(
                  [item for item in same_organizer if (item.get("date_start") or "") >= today_key and (item.get("organizer") or "") in landing_organizers],
                  key=related_sort
              )[:4]

              related_city_html = "".join(
                  f'<li><a href="/turniere/{esc(event_slug(item))}/">{esc(item.get("title") or "Pokerturnier")}</a>'
                  f'{f" · {esc(item.get("date_start", ""))}" if item.get("date_start") else ""}</li>'
                  for item in same_city
              )

              related_organizer_html = "".join(
                  f'<li><a href="/turniere/{esc(event_slug(item))}/">{esc(item.get("title") or "Pokerturnier")}</a>'
                  f'{f" · {esc(item.get("date_start", ""))}" if item.get("date_start") else ""}</li>'
                  for item in same_organizer
              )

              breadcrumb_items = [
                  {
                      "@type": "ListItem",
                      "position": 1,
                      "name": "Pokerturniere Schweiz",
                      "item": f"{BASE_URL}/"
                  }
              ]

              position = 2
              canton_code = str(event.get("canton") or "").strip().upper()
              canton_name = CANTON_NAMES.get(canton_code) or ""
              if canton_name and canton_name in landing_cantons:
                  canton_slug = slugify(canton_name)
                  breadcrumb_items.append({
                      "@type": "ListItem",
                      "position": position,
                      "name": canton_name,
                      "item": f"{BASE_URL}/kanton/{canton_slug}/"
                  })
                  position += 1

              if city:

                  city_slug = slugify(city)
                  breadcrumb_items.append({
                      "@type": "ListItem",
                      "position": position,
                      "name": city,
                      "item": f"{BASE_URL}/stadt/{city_slug}/"
                  })
                  position += 1

              breadcrumb_items.append({
                  "@type": "ListItem",
                  "position": position,
                  "name": title,
                  "item": url
              })

              breadcrumb_json = {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": breadcrumb_items
              }

              page_dir = OUT_DIR / slug
              page_dir.mkdir(parents=True, exist_ok=True)

              page = f"""<!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>{esc(title)}{f" – {esc(subtitle)}" if subtitle else ""} | {esc(city)} | Pokerturniere Schweiz</title>

            <meta
              name="description"
              content="{esc(description)}">

            <meta
              name="robots"
              content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">

            <link
              rel="canonical"
              href="{esc(url)}">
            <meta property="og:type" content="event">
            <meta property="og:title" content="{esc(title)}{f" – {esc(subtitle)}" if subtitle else ""} | {esc(city)} | Pokerturniere Schweiz">
            <meta property="og:description" content="{esc(description)}">
            <meta property="og:url" content="{esc(url)}">
            <meta property="og:site_name" content="Helvetic Poker">


            <script type="application/ld+json">
          {json.dumps(event_json, ensure_ascii=False, indent=2)}
            </script>

            <script type="application/ld+json">
          {json.dumps(breadcrumb_json, ensure_ascii=False, indent=2)}
            </script>

            <style>
          * {{
            box-sizing: border-box;
          }}

          html {{
            scroll-behavior: smooth;
          }}

          body {{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #151515;
            background:
              radial-gradient(circle at 10% 0%, rgba(200,16,46,.07), transparent 28%),
              radial-gradient(circle at 90% 10%, rgba(201,162,39,.08), transparent 24%),
              linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%);
            line-height: 1.55;
          }}

          a {{
            color: inherit;
          }}

          .site-header {{
            border-bottom: 1px solid rgba(0,0,0,.08);
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(12px);
          }}

          .header-inner {{
            max-width: 980px;
            margin: 0 auto;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
          }}

          .brand {{
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
          }}

          .brand img {{
            width: 150px;
            height: 72px;
            object-fit: contain;
            display: block;
          }}

          .brand span {{
            color: #c8102e;
          }}

          .back-link {{
            color: #555;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
          }}

          .back-link:hover {{
            color: #c8102e;
          }}

          main {{
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 20px 72px;
          }}

          .event-card {{
            position: relative;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e4e4e4;
            border-radius: 26px;
            box-shadow:
              0 22px 60px rgba(0,0,0,.08),
              0 3px 12px rgba(0,0,0,.04);
          }}

          .event-card::before {{
            content: "";
            display: block;
            height: 5px;
            background: linear-gradient(90deg, #c8102e 0%, #c8102e 68%, #c9a227 100%);
          }}

          .breadcrumbs {{
            padding: 20px 48px 0;
            color: #777;
            font-size: 13px;
          }}

          .breadcrumbs ol {{
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0;
            padding: 0;
            list-style: none;
          }}

          .breadcrumbs li {{
            display: inline-flex;
            align-items: center;
            gap: 6px;
          }}

          .breadcrumbs li:not(:last-child)::after {{
            content: "›";
            color: #aaa;
          }}

          .breadcrumbs a {{
            color: #666;
            text-decoration: none;
          }}

          .breadcrumbs a:hover {{
            color: #c8102e;
          }}

          .hero {{
            padding: 30px 48px 36px;
          }}

          .organizer-logo {{
            margin: 0 0 24px;
          }}

          .organizer-logo img {{
            display: block;
            width: 104px;
            height: 104px;
            object-fit: contain;
            border-radius: 18px;
            background: transparent;
            padding: 8px;
            border: 1px solid #e4e4e4;
            box-shadow: 0 8px 24px rgba(0,0,0,.10);
          }}

          .eyebrow {{
            display: inline-flex;
            align-items: center;
            min-height: 30px;
