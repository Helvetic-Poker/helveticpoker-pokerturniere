            <body>
                      <header class="site-header">
            <div class="header-inner">
              <div class="brand">
                <img src="/assets/helvetic-poker-logo.png?v=7" alt="Helvetic Poker">
                <span>Pokerturniere Schweiz</span>
              </div>
              <a class="back-link" href="/">← Zum Kalender</a>
            </div>
          </header>

          <main>
            <article class="event-card">

              <section class="hero">
                {organizer_logo_html}

                <div class="eyebrow">
                  {esc(event_type)}{f" · {esc(variant)}" if variant else ""}
                </div>

                <h1>{esc(title)}</h1>

                {f'<div class="subtitle">{esc(subtitle)}</div>' if subtitle else ''}
              </section>

              <section class="facts" aria-label="Turnierdetails">

                <div class="fact">
                  <span class="fact-label">Datum</span>
                  <span class="fact-value">{esc(date_text)}</span>
                </div>

                <div class="fact">
                  <span class="fact-label">Start</span>
                  <span class="fact-value">{esc(time + " Uhr" if time else "—")}</span>
                </div>

                <div class="fact">
                  <span class="fact-label">Buy-in</span>
                  <span class="fact-value">{esc(buy_in_label or "—")}</span>
                </div>

                <div class="fact">
                  <span class="fact-label">Spielart</span>
                  <span class="fact-value">{esc(variant or "—")}</span>
                </div>

              </section>

              <section class="content-section">
                <h2 class="section-title">Über dieses Turnier</h2>
                <p class="event-description">{esc(description)}</p>
              </section>

              <section class="content-section">
                <h2 class="section-title">Veranstaltungsort</h2>

                <div class="venue-card">
                  <p class="venue-name">{esc(venue or organizer or city)}</p>
                  <p class="venue-location">
                    {esc(street_address) if street_address else ""}
                  </p>
                  <p class="venue-location">
                    {esc(postal_code + " " if postal_code else "")}{esc(city)}
                  </p>
                  <div class="venue-links">
                    {f'<a href="https://www.google.com/maps/search/?api=1&query={quote(street_address + ", " + postal_code + " " + city)}" target="_blank" rel="noopener">📍 Route planen →</a>' if street_address else ''}
                    {f'<a href="/veranstalter/{slugify(organizer)}/">Veranstalter: {esc(organizer)} →</a>' if organizer and organizer in landing_organizers else ''}
                  </div>
                </div>
              </section>

              {
                f'''
              <section class="content-section">
                <h2 class="section-title">Weitere Pokerturniere in {esc(city)}</h2>
                <ul class="related-list">
                  {related_city_html}
                </ul>
              </section>
                '''
                if related_city_html else ''
              }

              {
                f'''
              <section class="content-section">
                <h2 class="section-title">Weitere Turniere von {esc(organizer)}</h2>
                <ul class="related-list">
                  {related_organizer_html}
                </ul>
              </section>
                '''
                if related_organizer_html and organizer and organizer not in city else ''
              }

              <div class="actions">

              <a class="btn secondary" href="/">
                ← Alle Pokerturniere
              </a>

              <button class="btn ghost" type="button" onclick="shareTournament()">
                ↗ Turnier teilen
              </button>

              {
                f'<a class="btn organizer-btn" href="{esc(organizer_url)}" target="_blank" rel="noopener">Zum Veranstalter →</a>'
                if organizer_url else ''
              }

                <div id="share-status" class="share-status" aria-live="polite"></div>

              </div>

              <div class="ad-slot" id="ad-slot-top" data-ad-slot="event-top" aria-hidden="true">
                Werbeplatz
              </div>

              <div class="ad-slot" id="ad-slot-bottom" data-ad-slot="event-bottom" aria-hidden="true">
                Werbeplatz
              </div>

            </article>
          </main>

          <footer class="footer">
            Helvetic Poker · Pokerturniere Schweiz
          </footer>

          <script>
            async function shareTournament() {{
              const shareData = {{
                title: document.title,
                text: "{esc(title)}{f" – {esc(venue)}" if venue else ""}",
                url: window.location.href
              }};

              const status = document.getElementById("share-status");

              try {{
                if (navigator.share) {{
                  await navigator.share(shareData);
                  return;
                }}

                await navigator.clipboard.writeText(window.location.href);
                status.textContent = "Link kopiert – du kannst ihn jetzt weiterleiten.";

              }} catch (error) {{
                if (error && error.name === "AbortError") {{
                  return;
                }}

                try {{
                  await navigator.clipboard.writeText(window.location.href);
                  status.textContent = "Link kopiert – du kannst ihn jetzt weiterleiten.";
                }} catch (_) {{
                  status.textContent = "Bitte kopiere die URL aus der Browserzeile.";
                }}
              }}
            }}
          </script>
          </body>
          </html>
          """

              (page_dir / "index.html").write_text(
                  page,
                  encoding="utf-8"
              )

              sitemap_urls.add(url)
              generated += 1

          exec((ROOT / "scripts" / "generate-landing-pages.py").read_text(encoding="utf-8"), globals())
          exec((ROOT / "scripts" / "generate-homepage-hub.py").read_text(encoding="utf-8"), globals())
          landing_url_file = ROOT / ".generated-landing-urls.txt"
          if landing_url_file.exists():
              for landing_url in landing_url_file.read_text(encoding="utf-8").splitlines():
                  if landing_url.strip():
                      sitemap_urls.add(landing_url.strip())

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for sitemap_url in sorted(sitemap_urls):
              sitemap_lines.append(
                  f"  <url><loc>{html.escape(sitemap_url)}</loc></url>"
              )

          sitemap_lines.append("</urlset>")
          (ROOT / "sitemap.xml").write_text(
              "\n".join(sitemap_lines) + "\n",
              encoding="utf-8"
          )

          print(f"Generated {generated} tournament pages.")
          print(f"Wrote sitemap with {len(sitemap_urls)} URLs.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
