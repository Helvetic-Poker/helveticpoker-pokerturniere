name: Generate and deploy tournament pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/*.json"
      - ".github/workflows/generate-event-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate tournament pages
        run: |
          python3 - <<'PY'
          import json
          import html
          import re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ROOT = Path(".")
          DATA_DIR = ROOT / "data"
          OUT_DIR = ROOT / "turniere"
          BASE_URL = "https://pokerturniere.helveticpoker.ch"

          provider_logos = {
              "24Poker":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6b50286d-2f09-47d4-a018-8c326b0ecef7/1774464947679-24poker.png",
          "AZ Poker Club Bern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/1170cdc9-4cb0-4ac0-902f-19c369fa99b4/1774464942453-azpokerclub.jpg",
          "Airfield Pokerclub Interlaken":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/3a6035b2-ab43-4807-b3a5-28185be8f40b/1774465014142-pokerhelden.jpg",
          "Pokerhelden / Airfield Poker Club":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/3a6035b2-ab43-4807-b3a5-28185be8f40b/1774465014142-pokerhelden.jpg",
          "Another Poker Basel":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/c04768c0-8968-455e-acb3-38a42b79c3ee/1774464902622-anotherpoker.png",
          "Capital Poker Club Bern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/415712c9-af88-4b1e-a4a0-5ebc87de4470/1774464996304-capitalpokerclub.png",
          "FOIF DRÜ EFFRETIKON":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/d5555268-b285-4c9f-8c62-8a53811cc8da/1774464838755-foifdrue.png",
          "FullEdge Pokerclub Pratteln BL":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/e1315bad-abde-460a-9ee0-6a2bda3e13fb/1774464850053-fulledge.jpg",
          "House of Cards Luzern":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/e20c02d3-49e6-4dfb-b2c2-4b20f29eadad/1774464785696-houseofcards.jpg",
          "HSOP Helvetic Series of Poker":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/711a2b69-fae1-4b0b-afca-e83c36e2d9c1/1774464992979-hsop.jpg",
          "Munot Poker Schaffhausen":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6ce78667-c164-4a86-8874-e95496cb0bf5/1774464745546-munotpoker.png",
          "Prestige Poker Dietlikon":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/6870a596-1d3e-466f-af92-5dc034a1d727/1774464799361-prestigepoker.jpg",
          "STATION Poker Club":
              "https://zejcddvqhcbbmrufqsli.supabase.co/storage/v1/object/public/club-logos/7a6418b7-dfb0-4519-aab5-e857f421a6d7/1774464732962-stationpokerclub.jpg",
          "Poker Club St. Gallen":
              "/assets/logos/poker-club-st-gallen.png",
          "Swiss Casino St. Gallen":
              "https://static.wixstatic.com/media/98a788_df2ae3f8c7e34e1ab9eba87e99a6f506~mv2.png/v1/fill/w_1024%2Ch_768%2Cal_c/Logo_SwissCasino4_3%20%282%29.png",
          "Grand Casino Luzern":
              "https://luzernerfest.ch/images/sponsoren/casino-luzern.png",
          "sports ZUGERLAND":
              "https://media.jobs.ch/media/f07dacd6-410e-4b8f-ae42-d713278866bc",
          "Fridli Poker":
              "/assets/logos/fridli-poker.jpg",
          }

          def esc(value):
              return html.escape(str(value or ""), quote=True)

          def slugify(value):
              value = str(value or "").strip().lower()
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-")

          events = []

          for path in sorted(DATA_DIR.glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if isinstance(data, list):
                  events.extend(data)
              elif isinstance(data, dict):
                  if isinstance(data.get("events"), list):
                      events.extend(data["events"])
                  else:
                      events.append(data)

          generated = 0

          for event in events:
              slug = event.get("slug")

              if not slug:
                  parts = [
                      event.get("title"),
                      event.get("city"),
                      event.get("date_start"),
                      event.get("id"),
                  ]
                  slug = slugify("-".join(str(x) for x in parts if x))

              if not slug:
                  continue

              title = event.get("title") or "Pokerturnier"
              subtitle = event.get("subtitle") or ""
              city = event.get("city") or ""
              organizer = event.get("organizer") or ""
              venue = event.get("venue") or organizer
              variant = event.get("variant") or ""
              event_type = event.get("event_type") or ""
              buy_in_label = event.get("buy_in_label") or ""
              date_start = event.get("date_start") or ""
              time = event.get("time") or ""
              organizer_url = event.get("organizer_url") or ""

              display_date = date_start

              if date_start:
                  try:
                      y, m, d = date_start.split("-")
                      display_date = f"{d}.{m}.{y}"
                  except Exception:
                      pass

              date_text = display_date

              if time:
                  date_text += f" um {time} Uhr"

              details = []

              if variant:
                  details.append(variant)

              if buy_in_label:
                  details.append(f"Buy-in {buy_in_label}")

              if event_type:
                  details.append(event_type)

              detail_text = ", ".join(details)

              description = (
                  f"{title}"
                  + (f" – {subtitle}" if subtitle else "")
                  + (f" im {venue}" if venue else "")
                  + (f". {detail_text}" if detail_text else "")
                  + (f". {date_text}" if date_text else "")
                  + "."
              )

              url = f"{BASE_URL}/turniere/{slug}/"

              logo = (
                  provider_logos.get(organizer)
                  or event.get("provider_logo")
                  or ""
              )

              organizer_logo_html = ""

              if logo:
                  organizer_logo_html = f"""
                  <div class="organizer-logo">
                    <img
                      src="{esc(logo)}"
                      alt="{esc(organizer)} Logo"
                      loading="lazy">
                  </div>
                  """

              start_date_iso = date_start

              if date_start and time:
                  try:
                      local_dt = datetime.strptime(
                          f"{date_start} {time}",
                          "%Y-%m-%d %H:%M"
                      ).replace(
                          tzinfo=ZoneInfo("Europe/Zurich")
                      )

                      start_date_iso = local_dt.isoformat()
                  except Exception:
                      start_date_iso = f"{date_start}T{time}:00"

              event_json = {
                  "@context": "https://schema.org",
                  "@type": "Event",
                  "@id": url + "#event",
                  "url": url,
                  "name": title,
                  "description": description,
                  "startDate": start_date_iso,
                  "eventStatus": "https://schema.org/EventScheduled",
                  "location": {
                      "@type": "Place",
                      "name": venue or city
                  },
                  "organizer": {
                      "@type": "Organization",
                      "name": organizer
                  }
              }

              if organizer_url:
                  event_json["organizer"]["url"] = organizer_url

              page_dir = OUT_DIR / slug
              page_dir.mkdir(parents=True, exist_ok=True)

              page = f"""<!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <title>{esc(title)}{f" – {esc(subtitle)}" if subtitle else ""} | {esc(city)} | Helvetic Poker</title>

            <meta
              name="description"
              content="{esc(description)}">

            <meta
              name="robots"
              content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">

            <link
              rel="canonical"
              href="{esc(url)}">

            <script type="application/ld+json">
          {json.dumps(event_json, ensure_ascii=False, indent=2)}
            </script>

            <style>
          * {{
            box-sizing: border-box;
          }}

          html {{
            scroll-behavior: smooth;
          }}

          body {{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
              radial-gradient(circle at top left, rgba(201,162,39,.08), transparent 32%),
              linear-gradient(180deg, #f7f7f7 0%, #eeeeee 100%);
            color: #151515;
            line-height: 1.55;
          }}

          main {{
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 20px 72px;
          }}

          .card {{
            position: relative;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #e7e7e7;
            border-radius: 24px;
            padding: 48px;
            box-shadow:
              0 18px 50px rgba(0,0,0,.08),
              0 2px 8px rgba(0,0,0,.04);
          }}

          .card::before {{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #c8102e 0%, #c8102e 70%, #c9a227 100%);
          }}

          .organizer-logo {{
            margin: 0 0 28px;
          }}

          .organizer-logo img {{
            display: block;
            width: 112px;
            height: 112px;
            object-fit: contain;
            border-radius: 18px;
            background: #111;
            padding: 8px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 8px 22px rgba(0,0,0,.10);
          }}

          h1 {{
            margin: 0 0 10px;
            max-width: 820px;
            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.08;
            letter-spacing: -1.2px;
            font-weight: 800;
            color: #111;
          }}

          .subtitle {{
            color: #6a6a6a;
            font-size: 20px;
            line-height: 1.4;
            margin: 0 0 34px;
          }}

          .info {{
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0 0 34px;
          }}

          .row {{
            min-height: 88px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            background: #f8f8f8;
            border: 1px solid #e9e9e9;
            border-radius: 14px;
          }}

          .label {{
            display: block;
            color: #777;
            font-size: 12px;
            line-height: 1.2;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
          }}

          .row:not(:has(.label)) {{
            display: none;
          }}

          .row {{
            color: #171717;
            font-size: 17px;
            font-weight: 600;
          }}

          .row .label {{
            font-weight: 700;
          }}

          .info .row:nth-child(2n) {{
            background: #fff;
          }}

          .btn {{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 14px 22px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: #c8102e;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            transition:
              transform .18s ease,
              box-shadow .18s ease,
              background .18s ease;
          }}

          .btn:hover {{
            background: #a90d26;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(200,16,46,.20);
          }}

          .btn.secondary {{
            background: #171717;
            color: #fff;
          }}

          .btn.secondary:hover {{
            background: #2b2b2b;
            box-shadow: 0 8px 20px rgba(0,0,0,.16);
          }}

          .btn:focus-visible {{
            outline: 3px solid rgba(201,162,39,.55);
            outline-offset: 3px;
          }}

          @media (max-width: 700px) {{
            main {{
              padding: 28px 14px 48px;
            }}

            .card {{
              padding: 30px 22px 28px;
              border-radius: 20px;
            }}

            .organizer-logo img {{
              width: 92px;
              height: 92px;
              border-radius: 14px;
            }}

            h1 {{
              font-size: clamp(30px, 9vw, 42px);
              letter-spacing: -.7px;
            }}

            .subtitle {{
              font-size: 18px;
              margin-bottom: 26px;
            }}

            .info {{
              grid-template-columns: 1fr;
              gap: 10px;
              margin-bottom: 28px;
            }}

            .row {{
              min-height: 76px;
              padding: 15px 17px;
            }}

            .btn {{
              width: 100%;
              min-height: 52px;
            }}
          }}

          @media (prefers-reduced-motion: reduce) {{
            html {{
              scroll-behavior: auto;
            }}

            .btn {{
              transition: none;
            }}
          }}
        </style>
          </head>

          <body>
            <main>
              <div class="card">

                {organizer_logo_html}

                <h1>{esc(title)}</h1>

                {f'<div class="subtitle">{esc(subtitle)}</div>' if subtitle else ''}

                <div class="info">

                  <div class="row">
                    <span class="label">Datum:</span>
                    {esc(date_text)}
                  </div>

                  {f'''
                  <div class="row">
                    <span class="label">Ort:</span>
                    {esc(city)}
                  </div>
                  ''' if city else ''}

                  {f'''
                  <div class="row">
                    <span class="label">Veranstaltungsort:</span>
                    {esc(venue)}
                  </div>
                  ''' if venue else ''}

                  {f'''
                  <div class="row">
                    <span class="label">Variante:</span>
                    {esc(variant)}
                  </div>
                  ''' if variant else ''}

                  {f'''
                  <div class="row">
                    <span class="label">Buy-in:</span>
                    {esc(buy_in_label)}
                  </div>
                  ''' if buy_in_label else ''}

                  {f'''
                  <div class="row">
                    <span class="label">Veranstalter:</span>
                    {esc(organizer)}
                  </div>
                  ''' if organizer else ''}

                </div>

                {
                  f'<a class="btn" href="{esc(organizer_url)}" target="_blank" rel="noopener">Zum Veranstalter</a>'
                  if organizer_url else ''
                }

                <a class="btn secondary" href="/">
                  ← Alle Pokerturniere
                </a>

              </div>
            </main>
          </body>
          </html>
          """

              (page_dir / "index.html").write_text(
                  page,
                  encoding="utf-8"
              )

              generated += 1

          print(f"Generated {generated} tournament pages.")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
