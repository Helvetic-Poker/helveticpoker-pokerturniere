name: Tournament data quality report

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/*.json"
      - "scripts/check-event-data.py"
      - ".github/workflows/check-event-data.yml"

permissions:
  contents: read

jobs:
  quality-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check tournament data
        run: python3 scripts/check-event-data.py
